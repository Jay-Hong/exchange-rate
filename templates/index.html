<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환율 관리 대시보드</title>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            min-height: 100vh;
            color: #e0e0e0;
            padding: 5px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* 설정 패널 */
        .settings-panel {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        
        .settings-toggle {
            background: #3498db;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .settings-toggle:hover {
            background: #2980b9;
        }
        
        .settings-content {
            display: none;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        
        .settings-content.active {
            display: grid;
        }
        
        .setting-group {
            background: #2c2c2c;
            border-radius: 10px;
            padding: 15px;
        }
        
        .setting-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }
        
        .bank-checkboxes {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 8px;
            transition: all 0.2s ease;
            min-height: 44px;
        }
        
        .checkbox-item:hover {
            background: #353535;
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.8);
        }
        
        /* 첫 번째 항목 (기준) 스타일 */
        .checkbox-item:first-child {
            border-left: 3px solid #3498db;
            background: #252525;
        }
        
        .checkbox-item:first-child .reference-badge {
            font-size: 0.75rem;
            color: #3498db;
            margin-left: auto;
            padding: 2px 8px;
            background: rgba(52, 152, 219, 0.2);
            border-radius: 10px;
            font-weight: bold;
        }
        
        /* 드래그 핸들 */
        .drag-handle {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            color: #95a5a6;
            font-size: 18px;
            user-select: none;
            flex-shrink: 0;
            touch-action: none;
        }
        
        .drag-handle:hover {
            color: #3498db;
        }
        
        .drag-handle:active {
            cursor: grabbing;
        }
        
        /* 드래그 중인 항목 */
        .checkbox-item.dragging {
            opacity: 0.5;
            background: #34495e;
            transform: scale(1.02);
        }
        
        /* 드롭 가능 위치 표시 */
        .checkbox-item.drag-over {
            border-top: 3px solid #3498db;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            cursor: pointer;
        }
        
        .checkbox-item label {
            font-size: 0.95rem;
            cursor: pointer;
            flex-grow: 1;
            user-select: none;
        }
        
        /* 초기화 버튼 */
        .reset-order-btn {
            width: 100%;
            margin-top: 12px;
            padding: 10px;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .reset-order-btn:hover {
            background: #3d566e;
            transform: translateY(-1px);
        }
        
        .reset-order-btn:active {
            transform: translateY(0);
        }
        
        .drag-hint {
            font-size: 0.85rem;
            color: #95a5a6;
            margin-bottom: 8px;
            text-align: center;
            font-style: italic;
        }
        
        .sort-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .sort-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        /* 상태 표시 바 */
        .status-bar {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: center;
        }
        
        .status-online {
            color: #2ecc71;
        }
        
        .status-connecting {
            color: #f39c12;
        }
        
        .status-error {
            color: #e74c3c;
        }
        
        .last-update {
            font-size: 0.9rem;
            color: #95a5a6;
            margin-top: 5px;
        }
        
        /* 새로고침 버튼 */
        .refresh-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 0 10px;
        }
        
        .refresh-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #2980b9, #1f639a);
            transform: translateY(-2px);
        }
        
        .refresh-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 로딩 및 에러 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #3498db;
            font-size: 1.2rem;
        }
        
        .loading::after {
            content: "⟳";
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        
        /* 환율 표시 영역 */
        .currency-section {
            margin-bottom: 20px;
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        
        .currency-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        
        .bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            position: relative;
            height: 50px;
            opacity: 1;
            transform: translateY(0);
            transition: all 0.3s ease;
        }
        
        .bar-row.updating {
            opacity: 0.7;
            transform: translateY(-2px);
        }
        
        .bar {
            display: flex;
            align-items: center;
            height: 45px;
            border-radius: 6px;
            position: relative;
            transition: all 0.2s ease;
            min-width: 140px;
        }
        
        .bar.investing {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
        }
        
        .bar.bank {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        
        /* 은행별 개별 색상 */
        .bar.bank.kb { background: linear-gradient(135deg, #ffb200, #ffb200); }
        .bar.bank.hana { background: linear-gradient(135deg, #009792, #009792); }
        .bar.bank.shinhan { background: linear-gradient(135deg, #0052ff, #0052ff); }
        .bar.bank.woori { background: linear-gradient(135deg, #0089d4, #0089d4); }
        .bar.bank.ibk { background: linear-gradient(135deg, #0049a0, #0049a0); }
        .bar.bank.nh { background: linear-gradient(135deg, #00ac41, #00ac41); }
        .bar.bank.sc { background: linear-gradient(135deg, #0075f2, #0075f2); }
        .bar.bank.bs { background: linear-gradient(135deg, #dd1a25, #dd1a25); }
        .bar.bank.citi { background: linear-gradient(135deg, #006eb3, #006eb3); }
        
        /* 기준 은행 스타일 */
        .bar.reference-bank {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            border: 2px solid #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.3);
        }
        
        .bank-icon {
            width: 35px;
            height: 35px;
            margin: 0 6px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        
        .rate-value {
            margin-left: auto;
            margin-right: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }
        
        .rate-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 0px;
            min-width: 80px;
        }
        
        .rate-diff {
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 2px;
        }
        
        .rate-diff.positive {
            color: #e74c3c;
        }
        
        .rate-diff.negative {
            color: #29b44a;
        }
        
        .rate-diff.reference-label {
            color: #bdc3c7;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .timestamp {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: auto;
            padding-left: 15px;
            font-size: 0.8rem;
            color: #95a5a6;
            min-width: 60px;
            text-align: center;
            line-height: 1.2;
        }
        
        .date {
            font-weight: 500;
        }
        
        .time {
            font-weight: 400;
        }
        
        .no-data {
            text-align: center;
            color: #bdc3c7;
            font-style: italic;
            padding: 60px 20px;
            background: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        /* 24시간 그래프 (Phase 1A) */
        .graph-panel {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .graph-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .graph-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
        }

        .graph-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .graph-toggle-group {
            display: flex;
            flex: 1;
            gap: 6px;
        }

        .graph-toggle {
            border: 1px solid #444;
            background: #1f1f1f;
            color: #e0e0e0;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 76px;
        }

        .graph-toggle:hover {
            border-color: #777;
            transform: translateY(-1px);
        }

        .graph-toggle.line {
            border-color: #3498db;
            box-shadow: 0 0 0 1px rgba(52,152,219,0.4);
        }

        .graph-toggle.candle {
            border-color: #f39c12;
            box-shadow: 0 0 0 1px rgba(243,156,18,0.5);
            background: #2c2a1f;
        }

        .graph-toggle.off {
            opacity: 0.4;
        }

        .graph-toggle.dxy {
            border-color: #e06060;
            box-shadow: 0 0 0 1px rgba(224,96,96,0.4);
        }

        .graph-toggle.dxy.off {
            opacity: 0.4;
            box-shadow: none;
        }

        .period-tabs {
            display: flex;
            gap: 4px;
            margin-top: 12px;
        }

        .period-tab {
            flex: 1;
            border: 1px solid #444;
            background: #1f1f1f;
            color: #e0e0e0;
            padding: 8px 0;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .period-tab.active {
            background: #3498db;
            border-color: #3498db;
            color: white;
            font-weight: bold;
        }

        .period-tab:hover:not(.active) {
            border-color: #777;
        }

        #graph-currency {
            background: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #graph-currency:hover {
            background: #3498db;
            border-color: #3498db;
        }

        .graph-container {
            position: relative;
            height: 264px; /* 기존 400px의 약 2/3 높이 */
            width: 100%;
            background: #2c2c2c;
            border-radius: 10px;
            padding: 10px;
        }

        #graph-error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(44, 44, 44, 0.98);
            border-radius: 10px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 499px) {
            .settings-content {
                grid-template-columns: 1fr;
            }
        }

    </style>

    <!-- Chart.js 라이브러리 (Phase 1A 그래프 기능) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
</head>
<body>
    <div class="container">
        <!-- 설정 패널 -->
        <div class="settings-panel">
            <div class="settings-header">
                <h3>🔧 환율 표시 설정</h3>
                <button id="settings-toggle" class="settings-toggle">설정 열기</button>
            </div>
            <div id="settings-content" class="settings-content">
                <div class="setting-group">
                    <div class="setting-title">표시할 은행 선택</div>
                    <div class="drag-hint">☰ 드래그하여 순서 변경 (첫 번째가 기준)</div>
                    <div id="bank-checkboxes" class="bank-checkboxes">
                        <!-- 동적으로 생성됩니다 -->
                    </div>
                    <button id="reset-order-btn" class="reset-order-btn">
                        🔄 기본 순서로 초기화
                    </button>
                </div>
                <div class="setting-group">
                    <div class="setting-title">정렬 기준</div>
                    <div class="sort-options">
                        <label><input type="radio" name="sort-type" value="custom" checked> 설정 은행 순</label>
                        <label><input type="radio" name="sort-type" value="rate-asc"> 환율 낮은 순</label>
                        <label><input type="radio" name="sort-type" value="rate-desc"> 환율 높은 순</label>
                        <label><input type="radio" name="sort-type" value="update-desc"> 최신 업데이트 순</label>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 상태 표시 바 -->
        <div class="status-bar">
            <div id="connection-status" class="status-connecting">🟡 연결 중...</div>
            <div class="last-update">마지막 업데이트: <span id="last-update">-</span></div>
            <button id="refresh-btn" class="refresh-btn" onclick="reconnectWebSocket()">🔄 재연결</button>
        </div>
        
        <!-- 로딩 표시 -->
        <div id="loading" class="loading">환율 데이터를 불러오는 중...</div>

        <!-- 에러 메시지 -->
        <div id="error-message" class="error-message" style="display: none;"></div>

        <!-- 환율 그래프 (Phase 1A + Phase E) -->
        <div class="graph-panel" id="graph-panel" style="display: none;">
            <div class="graph-header">
                <div class="graph-title">📈 환율 그래프</div>
                <div class="graph-toggle-group" id="graph-toggle-group">
                </div>
                <div class="graph-actions">
                    <div id="graph-dxy-toggle"></div>
                    <select id="graph-currency">
                        <option value="usd-krw" selected>USD-KRW</option>
                        <option value="jpy-krw">JPY-KRW</option>
                        <option value="eur-krw">EUR-KRW</option>
                    </select>
                </div>
            </div>
            <div class="graph-container">
                <canvas id="rateChart"></canvas>
            </div>
            <div class="period-tabs" id="period-tabs">
                <button class="period-tab active" data-period="1d">1일</button>
                <button class="period-tab" data-period="1w">1주</button>
                <button class="period-tab" data-period="3m">3개월</button>
                <button class="period-tab" data-period="1y">1년</button>
            </div>
        </div>

        <!-- 환율 데이터 컨테이너 -->
        <div id="exchange-rates-container"></div>
    </div>
    
    <script>
        // 전역 변수 및 설정
        let currentData = null;
        let currentGraphCurrency = 'usd-krw';
        let latestGraphData = null;
        let ws = null;
        let reconnectAttempts = 0;
        let maxReconnectAttempts = 5;
        let reconnectDelay = 2000;

        // 그래프 기간/DXY 상태
        let currentPeriod = '1d';
        let dxyVisible = true;
        const DXY_COLOR = '#e06060';

        // 그래프 데이터 캐시 (기간별 × 통화별)
        const graphDataCache = {
            '1d': { 'usd-krw': null, 'jpy-krw': null, 'eur-krw': null },
            '1w': { 'usd-krw': null, 'jpy-krw': null, 'eur-krw': null },
            '3m': { 'usd-krw': null, 'jpy-krw': null, 'eur-krw': null },
            '1y': { 'usd-krw': null, 'jpy-krw': null, 'eur-krw': null },
        };
        // WebSocket 호환용 alias (1d 캐시 직접 참조)
        const graphData = graphDataCache['1d'];
        let scrollPosition = 0;
        let pingInterval = null;
        
        const DEFAULT_BANK_ORDER = ['investing', 'kb', 'hana', 'shinhan', 'woori', 'ibk', 'nh', 'sc', 'bs', 'citi'];
        
        // 은행 코드 -> 표시 이름 매핑
        const BANK_NAMES = {
            'investing': '인베스팅',
            'kb': '국민은행',
            'hana': '하나은행',
            'shinhan': '신한은행',
            'woori': '우리은행',
            'ibk': '기업은행',
            'nh': '농협은행',
            'sc': 'SC제일',
            'bs': '부산은행',
            'citi': '씨티은행'
        };
        
        let userSettings = {
            selectedBanks: ['investing', 'kb', 'hana', 'shinhan', 'woori', 'ibk', 'nh'],
            sortType: 'custom',
            bankOrder: [...DEFAULT_BANK_ORDER]
        };

        const GRAPH_BANKS = ['investing', 'kb', 'hana'];
        let graphModes = {
            investing: 'line',
            kb: 'line',
            hana: 'line'
        };

        function buildSeriesForChart(series) {
            let prevClose = null;
            return series.map(([ts, hi, lo, close]) => {
                const point = {
                    x: ts * 1000,
                    hi,
                    lo,
                    close,
                    prevClose
                };
                prevClose = close;
                return point;
            });
        }

        
        // 기간별 X축 설정
        function getTimeConfig(period) {
            switch (period) {
                case '1w': return { unit: 'day', displayFormats: { day: 'M/d (E)' } };
                case '3m': return { unit: 'week', displayFormats: { week: 'M/d' } };
                case '1y': return { unit: 'month', displayFormats: { month: 'yy.M' } };
                default: return { unit: 'hour', displayFormats: { hour: 'HH' } };
            }
        }

        function getXAxisLabel(period) {
            return period === '1d' ? '시간 (KST)' : '날짜';
        }

        // 기간별 소스 라벨
        function getSourceLabel(source, period) {
            if (source === 'reference') return '인베스팅';
            if (source === 'dxy') return '달러지수(DXY)';
            return source.toUpperCase();
        }

        function drawGraph(data) {
            if (!data || !data.sources) return;

            const pair = data.pair || currentGraphCurrency || 'usd-krw';
            const period = data.period || currentPeriod || '1d';
            currentGraphCurrency = pair;

            const now = Date.now();

            const colors = {
                investing: '#9db6d8',
                kb: '#ffb200',
                hana: '#00a7a0',
                reference: '#9db6d8'
            };

            const datasets = [];
            const allY = [];
            const allX = [];
            const dxyYValues = [];

            // 환율 소스 필터 (DXY 제외)
            const rateEntries = Object.entries(data.sources).filter(([source, series]) => {
                if (source === 'dxy') return false;
                if (!Array.isArray(series) || !series.length) return false;
                if (period === '1d') {
                    const mode = graphModes[source] || 'line';
                    return mode !== 'off';
                }
                return true;
            });

            if (rateEntries.length === 0 && !(data.sources.dxy && dxyVisible)) return;

            const singleMode = rateEntries.length === 1 && period === '1d';
            const seriesMap = {};

            rateEntries.forEach(([source, series]) => {
                const candleSeries = buildSeriesForChart(series);
                seriesMap[source] = candleSeries;
                candleSeries.forEach(p => {
                    allY.push(p.hi, p.lo);
                    allX.push(p.x);
                });
            });

            // 환율 데이터셋
            rateEntries.forEach(([source]) => {
                const candleSeries = seriesMap[source];
                const closeSeries = candleSeries.map(p => ({ x: p.x, y: p.close }));
                const color = colors[source] || '#9db6d8';
                const label = getSourceLabel(source, period);

                if (singleMode) {
                    const hiSeries = candleSeries.map(p => ({ x: p.x, y: p.hi }));
                    const loSeries = candleSeries.map(p => ({ x: p.x, y: p.lo }));
                    const light = color + '55';

                    datasets.push({
                        label: `${label} HIGH`,
                        data: hiSeries,
                        type: 'line',
                        borderColor: light,
                        backgroundColor: light,
                        borderWidth: 1,
                        pointRadius: 0,
                        tension: 0.2,
                        fill: false,
                        yAxisID: 'y',
                        _band: true
                    });

                    datasets.push({
                        label: `${label} LOW`,
                        data: loSeries,
                        type: 'line',
                        borderColor: light,
                        backgroundColor: light,
                        borderWidth: 1,
                        pointRadius: 0,
                        tension: 0.2,
                        fill: '-1',
                        yAxisID: 'y',
                        _band: true
                    });

                    datasets.push({
                        label: label,
                        data: closeSeries,
                        type: 'line',
                        borderColor: color,
                        backgroundColor: color + '33',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.2,
                        fill: false,
                        yAxisID: 'y'
                    });
                } else {
                    datasets.push({
                        label: label,
                        data: closeSeries,
                        type: 'line',
                        borderColor: color,
                        backgroundColor: color + '20',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1,
                        fill: false,
                        yAxisID: 'y'
                    });
                }
            });

            // DXY 데이터셋 (USD/KRW + dxyVisible)
            const hasDxy = data.sources.dxy && dxyVisible && pair === 'usd-krw';
            if (hasDxy) {
                const dxySeries = buildSeriesForChart(data.sources.dxy);
                const dxyCloseSeries = dxySeries.map(p => ({ x: p.x, y: p.close }));
                dxySeries.forEach(p => {
                    dxyYValues.push(p.hi, p.lo, p.close);
                    allX.push(p.x);
                });

                datasets.push({
                    label: '달러지수(DXY)',
                    data: dxyCloseSeries,
                    type: 'line',
                    borderColor: DXY_COLOR,
                    backgroundColor: DXY_COLOR + '20',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.2,
                    fill: false,
                    yAxisID: 'yDxy'
                });
            }

            // Y축 범위 계산 (환율)
            const yMin = allY.length ? Math.min(...allY) : 0;
            const yMax = allY.length ? Math.max(...allY) : 1;
            const range = yMax - yMin;
            const margin = Math.max(0.3, range * 0.05);
            const yLower = yMin - margin;
            const yUpper = yMax + margin;

            // X축 범위
            const xMin = allX.length ? Math.min(...allX) : now - 86400000;
            const xMax = allX.length ? Math.max(...allX) : now;

            // DXY Y축 범위
            let dxyScaleConfig = {};
            if (hasDxy && dxyYValues.length) {
                const dMin = Math.min(...dxyYValues);
                const dMax = Math.max(...dxyYValues);
                const dRange = dMax - dMin;
                const dMargin = Math.max(0.1, dRange * 0.05);
                dxyScaleConfig = {
                    yDxy: {
                        position: 'left',
                        title: { display: true, text: 'DXY', color: DXY_COLOR },
                        ticks: { color: DXY_COLOR, callback: (v) => v.toFixed(1) },
                        min: dMin - dMargin,
                        max: dMax + dMargin,
                        grid: { drawOnChartArea: false }
                    }
                };
            }

            const errorOverlay = document.getElementById('graph-error-overlay');
            if (errorOverlay) errorOverlay.remove();

            if (rateChart) rateChart.destroy();

            // X축 설정
            const timeConfig = getTimeConfig(period);
            const xAxisConfig = {
                type: 'time',
                time: timeConfig,
                min: xMin,
                max: period === '1d' ? now : xMax,
                title: { display: true, text: getXAxisLabel(period), color: '#e0e0e0' },
                ticks: { color: '#bdc3c7' },
                grid: { color: '#444', lineWidth: 1 }
            };

            // 1d일 때만 KST 시간 포맷 + 자정 강조
            if (period === '1d') {
                xAxisConfig.ticks.callback = (value) => formatHourKST(value);
                xAxisConfig.grid.color = (ctx) => {
                    if (!ctx || !ctx.tick || ctx.tick.value === undefined) return '#444';
                    const hour = (new Date(ctx.tick.value).getUTCHours() + 9) % 24;
                    return hour === 0 ? '#777' : '#444';
                };
            }

            const ctx = document.getElementById('rateChart').getContext('2d');
            rateChart = new Chart(ctx, {
                type: 'line',
                data: { datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: '#e0e0e0',
                                filter: (item, chartData) => {
                                    const ds = chartData.datasets[item.datasetIndex];
                                    return !ds._band;
                                }
                            }
                        },
                        tooltip: {
                            filter: (tooltipItem) => !tooltipItem.dataset._band,
                            callbacks: {
                                label: (tooltipCtx) => {
                                    const ds = tooltipCtx.dataset;
                                    if (ds._band) return null;

                                    // DXY는 소수점 1자리
                                    if (ds.yAxisID === 'yDxy') {
                                        return `${ds.label}: ${tooltipCtx.parsed.y.toFixed(2)}`;
                                    }

                                    // Single mode (1d, 소스 1개): Range 정보
                                    if (singleMode) {
                                        const firstKey = Object.keys(seriesMap)[0];
                                        if (firstKey && tooltipCtx.dataIndex < seriesMap[firstKey].length) {
                                            const point = seriesMap[firstKey][tooltipCtx.dataIndex];
                                            return [
                                                `${ds.label}: ${tooltipCtx.parsed.y.toFixed(2)}`,
                                                `Range: ${point.lo.toFixed(2)} - ${point.hi.toFixed(2)}`
                                            ];
                                        }
                                    }

                                    return `${ds.label}: ${tooltipCtx.parsed.y.toFixed(2)}`;
                                },
                                labelColor: (tooltipCtx) => {
                                    if (tooltipCtx.dataset._band) {
                                        return { borderColor: 'transparent', backgroundColor: 'transparent' };
                                    }
                                    return {
                                        borderColor: tooltipCtx.dataset.borderColor,
                                        backgroundColor: tooltipCtx.dataset.borderColor
                                    };
                                }
                            }
                        }
                    },
                    scales: {
                        x: xAxisConfig,
                        y: {
                            position: 'right',
                            title: { display: true, text: '환율 (KRW)', color: '#e0e0e0' },
                            ticks: { callback: (value) => value.toFixed(2), color: '#bdc3c7' },
                            beginAtZero: false,
                            min: yLower,
                            max: yUpper,
                            grid: {
                                color: (ctx) => {
                                    if (!ctx || !ctx.tick || typeof ctx.tick.value !== 'number') return '#444';
                                    const isInt = Math.abs(ctx.tick.value - Math.round(ctx.tick.value)) < 1e-6;
                                    return isInt ? '#777' : '#444';
                                },
                                lineWidth: 1
                            }
                        },
                        ...dxyScaleConfig
                    }
                },
                plugins: []
            });

            document.getElementById('graph-panel').style.display = 'block';
            document.getElementById('graph-currency').value = pair;
            renderGraphToggleButtons();
            console.log(`✅ 그래프 렌더 완료: ${pair}, period: ${period}`);
        }

const loadingEl = document.getElementById('loading');

        function loadUserSettings() {

            if (saved) {
                const savedSettings = JSON.parse(saved);
                userSettings = { 
                    ...userSettings, 
                    ...savedSettings,
                    bankOrder: savedSettings.bankOrder || [...DEFAULT_BANK_ORDER]
                };

        }

        function loadGraphModes() {

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    Object.entries(parsed).forEach(([k, v]) => {

                    });

                }
            }
            // DXY 표시 상태 복원

                try { dxyVisible = JSON.parse(savedDxy); } catch (_) { /* ignore */ }
            }
        }

        function saveGraphModes() {
            localStorage.setItem('graphModes', JSON.stringify(graphModes));
        }
        
        function saveUserSettings() {
            localStorage.setItem('exchangeRateSettings', JSON.stringify(userSettings));
        }

        function handleGraphToggle(bank) {
            if (bank === 'dxy') {
                dxyVisible = !dxyVisible;
                localStorage.setItem('dxyVisible', JSON.stringify(dxyVisible));
                renderGraphToggleButtons();
                const cached = graphDataCache[currentPeriod][currentGraphCurrency];
                if (cached) {
                    drawGraph({ pair: currentGraphCurrency, sources: cached, period: currentPeriod });
                }
                return;
            }

            const current = graphModes[bank] || 'line';
            graphModes[bank] = current === 'off' ? 'line' : 'off';

            if (!GRAPH_BANKS.some(b => graphModes[b] !== 'off')) {
                graphModes[bank] = 'line';
            }

            saveGraphModes();
            renderGraphToggleButtons();

            const cached = graphDataCache[currentPeriod][currentGraphCurrency];
            if (cached) {
                drawGraph({ pair: currentGraphCurrency, sources: cached, period: currentPeriod });
            } else {
                loadGraph(currentGraphCurrency, currentPeriod);
            }
        }
        
        function createBankCheckboxes(availableBanks) {
            // bankOrder 순서대로 정렬
            const sortedBanks = [...availableBanks].sort((a, b) => {
                const aIndex = userSettings.bankOrder.indexOf(a);
                const bIndex = userSettings.bankOrder.indexOf(b);
                
                // bankOrder에 없는 은행은 뒤로
                if (aIndex === -1 && bIndex === -1) return 0;
                if (aIndex === -1) return 1;
                if (bIndex === -1) return -1;
                
                return aIndex - bIndex;
            });
            
            bankCheckboxesEl.innerHTML = '';
            
            sortedBanks.forEach((bank, index) => {
                const checkboxItem = document.createElement('div');
                checkboxItem.className = 'checkbox-item';
                checkboxItem.dataset.bank = bank;
                checkboxItem.draggable = true;
                
                // 드래그 핸들
                const dragHandle = document.createElement('div');
                dragHandle.className = 'drag-handle';
                dragHandle.innerHTML = '☰';
                dragHandle.setAttribute('aria-label', '드래그하여 순서 변경');
                
                // 체크박스
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `bank-${bank}`;
                checkbox.value = bank;
                checkbox.checked = userSettings.selectedBanks.includes(bank);
                
                // 레이블
                const label = document.createElement('label');
                label.setAttribute('for', `bank-${bank}`);
                label.textContent = BANK_NAMES[bank] || bank;
                
                // 첫 번째 항목에 "기준" 뱃지 추가
                if (index === 0) {
                    const badge = document.createElement('span');
                    badge.className = 'reference-badge';
                    badge.textContent = '기준';
                    checkboxItem.appendChild(dragHandle);
                    checkboxItem.appendChild(checkbox);
                    checkboxItem.appendChild(label);
                    checkboxItem.appendChild(badge);
                } else {
                    checkboxItem.appendChild(dragHandle);
                    checkboxItem.appendChild(checkbox);
                    checkboxItem.appendChild(label);
                }
                
                // 이벤트 리스너
                checkbox.addEventListener('change', function() {
                    if (this.checked) {
                        if (!userSettings.selectedBanks.includes(bank)) {
                            userSettings.selectedBanks.push(bank);
                        }
                    } else {
                        userSettings.selectedBanks = userSettings.selectedBanks.filter(b => b !== bank);
                    }
                    saveUserSettings();
                    if (currentData) {
                        updateUI(currentData);
                    }
                });
                
                // Drag & Drop 이벤트
                checkboxItem.addEventListener('dragstart', handleDragStart);
                checkboxItem.addEventListener('dragover', handleDragOver);
                checkboxItem.addEventListener('drop', handleDrop);
                checkboxItem.addEventListener('dragend', handleDragEnd);
                checkboxItem.addEventListener('dragenter', handleDragEnter);
                checkboxItem.addEventListener('dragleave', handleDragLeave);
                
                // 터치 이벤트 (모바일 대응)
                let touchStartY = 0;
                let isTouchDragging = false;
                
                dragHandle.addEventListener('touchstart', function(e) {
                    touchStartY = e.touches[0].clientY;
                    isTouchDragging = true;
                    checkboxItem.classList.add('dragging');
                    draggedElement = checkboxItem;
                    draggedBank = bank;
                }, { passive: true });
                
                bankCheckboxesEl.appendChild(checkboxItem);
            });
        }

        function renderGraphToggleButtons() {
            const group = document.getElementById('graph-toggle-group');
            const dxyContainer = document.getElementById('graph-dxy-toggle');
            if (!group) return;
            group.innerHTML = '';
            if (dxyContainer) dxyContainer.innerHTML = '';

        function initializeGraphToggles() {
            renderGraphToggleButtons();
            const group = document.getElementById('graph-toggle-group');
            const dxyContainer = document.getElementById('graph-dxy-toggle');
            const handler = (e) => {

        // Drag & Drop 핸들러
        function handleDragStart(e) {
            draggedElement = this;
            draggedBank = this.dataset.bank;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }
        
        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }
        
        function handleDragEnter(e) {
            if (this !== draggedElement) {
                this.classList.add('drag-over');
            }
        }
        
        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }
        
        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            
            this.classList.remove('drag-over');
            
            if (draggedElement !== this) {
                const allItems = Array.from(bankCheckboxesEl.querySelectorAll('.checkbox-item'));
                const draggedIndex = allItems.indexOf(draggedElement);
                const targetIndex = allItems.indexOf(this);
                
                // DOM 재배치
                if (draggedIndex < targetIndex) {
                    this.parentNode.insertBefore(draggedElement, this.nextSibling);
                } else {
                    this.parentNode.insertBefore(draggedElement, this);
                }
                
                // bankOrder 업데이트
                updateBankOrderFromDOM();
            }
            
            return false;
        }
        
        function handleDragEnd(e) {
            this.classList.remove('dragging');
            
            // 모든 drag 관련 클래스 제거 및 상태 초기화
            document.querySelectorAll('.checkbox-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            
            draggedElement = null;
            draggedBank = null;
        }
        
        function updateBankOrderFromDOM() {
            const newOrder = Array.from(bankCheckboxesEl.querySelectorAll('.checkbox-item'))
                .map(item => item.dataset.bank);
            
            userSettings.bankOrder = newOrder;
            saveUserSettings();
            
            // DOM 재생성으로 모든 상태 완전히 초기화 (호버 버그 해결)
            createBankCheckboxes(newOrder);
            
            if (currentData) {
                updateUI(currentData);
            }
        }
        
        function saveScrollPosition() {
            scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
        }
        
        function restoreScrollPosition() {
            window.scrollTo({
                top: scrollPosition,
                behavior: 'auto'
            });
        }
        
        function initializeWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            console.log(`🔌 WebSocket 연결 시도: ${wsUrl}`);
            updateStatus('connecting');
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                console.log('✅ WebSocket 연결 성공');
                reconnectAttempts = 0;
                updateStatus('success');
                hideError();
                
                if (pingInterval) clearInterval(pingInterval);
                pingInterval = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send('ping');
                    }
                }, 30000);
            };

            // 그래프 버킷 업데이트 함수 (WebSocket용)
            function updateAllGraphBuckets(buckets) {
                if (!buckets) return;

                for (const [currency, sources] of Object.entries(buckets)) {
                    // 1d 캐시만 업데이트 (WebSocket 버킷은 10분 단위)
                    if (!graphData[currency]) continue;

                    for (const [source, bucket] of Object.entries(sources)) {
                        const series = graphData[currency][source];
                        if (!series || series.length === 0) continue;

                        const lastBucket = series[series.length - 1];
                        const bucketTs = bucket.bucket_ts;

                        if (lastBucket[0] === bucketTs) {
                            series[series.length - 1] = [
                                bucketTs,
                                bucket.max,
                                bucket.min,
                                bucket.close
                            ];
                        } else if (bucketTs > lastBucket[0]) {
                            series.push([bucketTs, bucket.max, bucket.min, bucket.close]);

                            const cutoff = Math.floor(Date.now() / 1000) - 86400;
                            while (series.length && series[0][0] < cutoff) {
                                series.shift();
                            }
                        }
                    }
                }

                // 1d 기간 표시 중일 때만 재렌더링
                if (currentPeriod === '1d' && currentGraphCurrency && graphData[currentGraphCurrency]) {
                    drawGraph({pair: currentGraphCurrency, sources: graphData[currentGraphCurrency], period: '1d'});
                }
            }

            ws.onmessage = function(event) {
                try {
                    const message = JSON.parse(event.data);
                    
                    switch (message.type) {
                        case 'pong':
                            console.log('🏓 Pong 수신');
                            break;
                            
                        case 'rates':
                            console.log('📊 환율 데이터 수신:', message.data);
                            hideLoading();
                            
                            saveScrollPosition();
                            
                            if (!currentData && message.data.metadata && message.data.metadata.banks) {
                                createBankCheckboxes(message.data.metadata.banks);
                            }
                            
                            currentData = message.data;
                            updateUI(message.data);
                            updateStatus('success', message.data.metadata.updated_at);

                            // 그래프 버킷 업데이트 (WebSocket 통합)
                            if (message.graph_buckets) {
                                updateAllGraphBuckets(message.graph_buckets);
                            }

                            setTimeout(restoreScrollPosition, 50);
                            break;
                            
                        case 'error':
                            console.error('⚠️ 서버 에러:', message.data);
                            showError(message.data.message || '서버 오류가 발생했습니다.');
                            break;
                            
                        case 'notification':
                            console.log('🔔 알림:', message.data);
                            break;
                            
                        default:
                            console.warn('❓ 알 수 없는 메시지 타입:', message.type);
                    }
                    
                } catch (error) {
                    console.error('❌ 메시지 처리 오류:', error);
                    showError('데이터 처리 중 오류가 발생했습니다.');
                }
            };
            
            ws.onerror = function(error) {
                console.error('❌ WebSocket 오류:', error);
                updateStatus('error');
            };
            
            ws.onclose = function(event) {
                console.log('🔌 WebSocket 연결 종료:', event.code, event.reason);
                updateStatus('error');
                
                if (pingInterval) {
                    clearInterval(pingInterval);
                    pingInterval = null;
                }
                
                if (reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    const delay = reconnectDelay * reconnectAttempts;
                    console.log(`🔄 ${delay/1000}초 후 재연결 시도 (${reconnectAttempts}/${maxReconnectAttempts})`);
                    showError(`연결이 끊어졌습니다. ${delay/1000}초 후 재연결 시도 중... (${reconnectAttempts}/${maxReconnectAttempts})`);
                    setTimeout(initializeWebSocket, delay);
                } else {
                    showError('서버와의 연결에 실패했습니다. 새로고침 버튼을 눌러주세요.');
                    console.error('❌ 최대 재연결 시도 횟수 초과');
                }
            };
        }
        
        function reconnectWebSocket() {
            console.log('🔄 수동 재연결 시도');
            reconnectAttempts = 0;
            
            if (ws) {
                ws.close();
            }
            
            hideError();
            initializeWebSocket();
        }
        
        function updateUI(data) {
            const groupedData = groupRatesByCurrency(data.rates);
            
            let html = '';
            const currencies = ['usd-krw', 'jpy-krw', 'eur-krw'];
            
            currencies.forEach(currency => {
                if (groupedData[currency] && groupedData[currency].length > 0) {
                    html += createCurrencySection(currency, groupedData[currency]);
                }
            });
            
            containerEl.innerHTML = html || '<div class="no-data">선택된 은행의 환율 데이터가 없습니다.</div>';
            attachEventListeners();
        }
        
        function filterAndSortRates(rates) {
            // 기준 은행 찾기 (bankOrder의 첫 번째 은행)
            const referenceBank = userSettings.bankOrder[0];
            const referenceRate = rates.find(r => r.bank === referenceBank);
            
            // 표시할 은행들만 필터링
            let filteredRates = rates.filter(rate => 
                userSettings.selectedBanks.includes(rate.bank)
            );
            
            // 기준 은행과 나머지 분리
            const reference = filteredRates.find(r => r.bank === referenceBank);
            const others = filteredRates.filter(r => r.bank !== referenceBank);

            switch (userSettings.sortType) {
                case 'custom':
                    others.sort((a, b) => {
                        const aIndex = userSettings.bankOrder.indexOf(a.bank);
                        const bIndex = userSettings.bankOrder.indexOf(b.bank);
                        return (aIndex === -1 ? 999 : aIndex) - (bIndex === -1 ? 999 : bIndex);
                    });
                    break;
                case 'rate-asc':
                    others.sort((a, b) => a.rate - b.rate);
                    break;
                case 'rate-desc':
                    others.sort((a, b) => b.rate - a.rate);
                    break;
                case 'update-desc':
                    others.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    break;
            }
            
            // 기준 은행을 항상 첫 번째로 (선택되어 있을 때만)
            // 선택 해제되어도 referenceRate는 유지 (차이값 계산용)
            const result = reference ? [reference, ...others] : others;
            return { filteredRates: result, referenceRate: referenceRate };
        }
        
        function groupRatesByCurrency(rates) {
            const grouped = {};
            rates.forEach(rate => {
                if (!grouped[rate.currency]) {
                    grouped[rate.currency] = [];
                }
                grouped[rate.currency].push(rate);
            });
            return grouped;
        }
        
        function createCurrencySection(currency, rates) {
            // 기준 은행 찾기
            const referenceBank = userSettings.bankOrder[0];
            
            // filterAndSortRates를 통해 정렬된 데이터와 기준 환율 가져오기
            const sortedData = filterAndSortRates(rates);
            const filteredRates = sortedData.filteredRates;
            const referenceRate = sortedData.referenceRate;
            
            if (filteredRates.length === 0) {
                return '';
            }
            
            const allRateValues = filteredRates.map(r => r.rate);
            const minRate = Math.min(...allRateValues);
            const maxRate = Math.max(...allRateValues);
            const rateRange = maxRate - minRate;
            
            let html = `
                <div class="currency-section">
                    <h2 class="currency-title">${currency.replace('-', '/')}</h2>
                    <div class="bar-container">
            `;
            
            filteredRates.forEach(rate => {
                const barWidth = calculateBarWidth(rate.rate, minRate, rateRange);
                html += createBarRow(rate, barWidth, referenceRate, referenceBank);
            });
            
            html += `
                    </div>
                </div>
            `;
            
            return html;
        }
        
        function calculateBarWidth(rate, minRate, rateRange) {
            if (rateRange === 0) return 65;
            
            if (rateRange >= 4) return 30 + (rate - minRate) / rateRange * 40;
            if (rateRange >= 3) return 35 + (rate - minRate) / rateRange * 34;
            if (rateRange >= 2) return 40 + (rate - minRate) / rateRange * 28;
            if (rateRange >= 1) return 46 + (rate - minRate) / rateRange * 21;
            if (rateRange >= 0.6) return 49 + (rate - minRate) / rateRange * 17;
            if (rateRange > 0.3) return 52 + (rate - minRate) / rateRange * 13;
            return 55 + (rate - minRate) / rateRange * 7;
        }
        
        function createBarRow(rate, barWidth, referenceRate, referenceBank) {
            const isReference = rate.bank === referenceBank;
            const diff = referenceRate ? rate.rate - referenceRate.rate : 0;
            
            // 기준 은행일 때는 은행 이름 표시, 아니면 차이값 표시
            const diffDisplay = isReference ? 
                (BANK_NAMES[referenceBank] || referenceBank) : 
                ((diff > 0 ? '+' : '') + diff.toFixed(2));
            
            const timestamp = new Date(rate.timestamp);
            const displayDate = `${String(timestamp.getMonth() + 1).padStart(2, '0')}-${String(timestamp.getDate()).padStart(2, '0')}`;
            const displayTime = `${String(timestamp.getHours()).padStart(2, '0')}:${String(timestamp.getMinutes()).padStart(2, '0')}`;
            
            // 기준 은행 스타일 결정
            let barClass = 'bank';
            if (isReference) {
                if (rate.bank === 'investing') {
                    barClass = 'investing reference-bank';
                } else {
                    barClass = 'bank reference-bank';
                }
            } else if (rate.bank === 'investing' && !isReference) {
                // investing이 기준이 아닌 경우에도 원래 색상 유지
                barClass = 'investing';
            }
            
            return `
                <div class="bar-row">
                    <div class="bar ${barClass} ${rate.bank}" style="width: ${barWidth}%;">
                        <img src="/static/${rate.bank === 'investing' ? 'investing_65.png' : rate.bank + '_bank_65.png'}" 
                             alt="${rate.bank}" class="bank-icon" 
                             onerror="this.src='/static/investing_65.png'">
                        <span class="rate-value">${rate.rate.toFixed(2)}</span>
                    </div>
                    
                    <div class="rate-info">
                        <div class="rate-diff ${isReference ? 'reference-label' : (diff > 0 ? 'positive' : 'negative')}">
                            ${diffDisplay}
                        </div>
                    </div>
                    
                    <div class="timestamp">
                        <div class="date">${displayDate}</div>
                        <div class="time">${displayTime}</div>
                    </div>
                </div>
            `;
        }
        
        function updateStatus(status, updateTime = null) {
            if (status === 'success') {
                statusEl.className = 'status-online';
                statusEl.textContent = '🟢 연결됨';
                if (updateTime) {
                    const timestamp = new Date(updateTime);
                    lastUpdateEl.textContent = timestamp.toLocaleString('ko-KR');
                }
            } else if (status === 'connecting') {
                statusEl.className = 'status-connecting';
                statusEl.textContent = '🟡 연결 중...';
            } else {
                statusEl.className = 'status-error';
                statusEl.textContent = '🔴 연결 오류';
            }
        }
        
        function showLoading() {
            loadingEl.style.display = 'block';
            containerEl.style.display = 'none';
        }
        
        function hideLoading() {
            loadingEl.style.display = 'none';
            containerEl.style.display = 'block';
        }
        
        function showError(message) {
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
        
        function hideError() {
            errorEl.style.display = 'none';
        }
        
        function attachEventListeners() {
            document.querySelectorAll('.bar').forEach(bar => {
                bar.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.02)';
                    this.style.boxShadow = '0 4px 15px rgba(0,0,0,0.4)';
                });
                
                bar.addEventListener('mouseleave', function() {
                    this.style.transform = 'scale(1)';
                    this.style.boxShadow = 'none';
                });
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 페이지 로드 완료, 초기화 시작');

            loadUserSettings();
            loadGraphModes();
            initializeSettingsPanel();
            initializeGraphToggles();
            
            document.querySelector(`input[name="sort-type"][value="${userSettings.sortType}"]`).checked = true;
            
            initializeWebSocket();
            
            window.addEventListener('beforeunload', function() {
                if (ws) {
                    ws.close();
                }
                if (pingInterval) {
                    clearInterval(pingInterval);
                }
            });

            console.log('✅ 초기화 완료 - 설정:', userSettings);
        });

        // ═══════════════════════════════════════════════════════════
        // 24시간 환율 그래프 (Phase 1A)
        // ═══════════════════════════════════════════════════════════
        let rateChart = null;

        // KST 24시간제 시간 라벨 (0~23, 앞자리 0 제거)
        const formatHourKST = (ts) => {
            const d = new Date(ts);
            const hour = (d.getUTCHours() + 9) % 24; // KST = UTC+9, DST 없음
            return String(hour);
        };

        // 데이터 갭 감지 (기간별 임계값)
        function detectDataGap(currency, period) {
            period = period || '1d';
            const cached = graphDataCache[period][currency];
            if (!cached) return true;

            const primaryKey = period === '1d' ? 'investing' : 'reference';
            const series = cached[primaryKey];
            if (!series || series.length === 0) return true;

            const lastBucket = series[series.length - 1][0];
            const now = Math.floor(Date.now() / 1000);
            const gap = now - lastBucket;

            const GAP_THRESHOLDS = { '1d': 900, '1w': 7200, '3m': 86400, '1y': 86400 };
            return gap > (GAP_THRESHOLDS[period] || 900);
        }

        // 그래프 로드 함수 (기간 인식 + Lazy Loading + 갭 감지)
        async function loadGraph(currency, period) {
            period = period || currentPeriod || '1d';
            try {
                const needsFullLoad = !graphDataCache[period][currency] || detectDataGap(currency, period);

                if (needsFullLoad) {
                    const url = period === '1d'
                        ? `/api/graph/${currency}`
                        : `/api/graph/${currency}?range=${period}`;
                    const res = await fetch(url);
                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}`);
                    }

                    const data = await res.json();
                    graphDataCache[period][currency] = data.sources;

                    console.log(`📥 데이터 로드: ${currency} (${period})`);
                } else {
                    console.log(`⚡ 캐시 사용: ${currency} (${period})`);
                }

                currentGraphCurrency = currency;
                currentPeriod = period;
                latestGraphData = {pair: currency, sources: graphDataCache[period][currency], period: period};
                window._latestGraphData = latestGraphData;
                drawGraph(latestGraphData);

            } catch (error) {
                console.error('❌ 그래프 로드 실패:', error);

                const graphPanel = document.getElementById('graph-panel');
                graphPanel.style.display = 'block';

                let errorOverlay = document.getElementById('graph-error-overlay');
                if (!errorOverlay) {
                    errorOverlay = document.createElement('div');
                    errorOverlay.id = 'graph-error-overlay';
                    document.querySelector('.graph-container').appendChild(errorOverlay);
                }

                errorOverlay.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px;">
                        <div style="font-size: 3rem; margin-bottom: 15px;">📉</div>
                        <div style="font-size: 1.2rem; color: #e74c3c; margin-bottom: 10px; font-weight: bold;">그래프 로드 실패</div>
                        <div style="font-size: 0.9rem; color: #bdc3c7; margin-bottom: 25px;">네트워크 오류 또는 서버 문제가 발생했습니다.</div>
                        <button onclick="retryLoadGraph('${currency}')" style="background: #3498db; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 0.95rem; cursor: pointer; transition: background 0.3s;">
                            🔄 다시 시도
                        </button>
                    </div>
                `;
            }
        }

        // 그래프 재시도 (에러 오버레이 제거 후 재로드)
        function retryLoadGraph(currency) {
                const errorOverlay = document.getElementById('graph-error-overlay');
                if (errorOverlay) {
                    errorOverlay.remove();
                }

                document.getElementById('graph-currency').value = currency;
            loadGraph(currency, currentPeriod);
        }

        // 통화 변경 이벤트
        document.getElementById('graph-currency').addEventListener('change', (e) => {
            loadGraph(e.target.value, currentPeriod);
        });

        // 기간 탭 이벤트
        function initializePeriodTabs() {
            const tabContainer = document.getElementById('period-tabs');
            if (!tabContainer) return;

            tabContainer.addEventListener('click', (e) => {
                const tab = e.target.closest('.period-tab');
                if (!tab || tab.classList.contains('active')) return;

                tabContainer.querySelectorAll('.period-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                currentPeriod = tab.dataset.period;
                renderGraphToggleButtons();
                loadGraph(currentGraphCurrency, currentPeriod);
            });
        }

        // 초기 로드 (페이지 로드 후)
        document.addEventListener('DOMContentLoaded', () => {
            initializePeriodTabs();
            setTimeout(() => {
                loadGraph('usd-krw', '1d');
            }, 1000);
        });

        // 백그라운드 복귀 시 새로고침
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && rateChart) {
                const currentCurrency = document.getElementById('graph-currency').value;
                loadGraph(currentCurrency, currentPeriod);
            }
        });
    </script>
</body>
</html>
