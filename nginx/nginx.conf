# ═════════════════════════════════════════════════════════════
# Nginx Main Configuration
# ═════════════════════════════════════════════════════════════

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;  # Linux 최적화
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─────────────────────────────────────
    # 로그 형식
    # ─────────────────────────────────────
    # ⚠️ `limit_req_status`/`limit_conn_status` 는 **상한을 넣기 전에** 있어야 한다 — 없으면
    #    "실제 거절 건수"를 셀 수 없어 정상 사용자를 자르고 있는지 확인할 방법이 없다.
    #    (상한 자체는 관측 뒤에 정한다 — 서버 FREE_TIER_ACCESS_MODEL_PLAN §자원 상한.)
    # ⛔ 이 로그로 **WS 동시 연결/handshake 유입률을 알 수는 없다** — WS access log 는 연결이
    #    끝날 때 기록되므로 장수명 연결은 아직 나타나지 않는다. 그건 앱 계측이 담당한다
    #    (`GET /admin/api/ws-connection-metrics`).
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time lrs=$limit_req_status lcs=$limit_conn_status '
                      'cp="$http_x_client_platform" cv="$http_x_client_version" cb="$http_x_client_build"';

    log_format  json_combined escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"'
    '}';

    access_log  /var/log/nginx/access.log  main;

    # ─────────────────────────────────────
    # 성능 최적화
    # ─────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ─────────────────────────────────────
    # Gzip 압축
    # ─────────────────────────────────────
    gzip  on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1000;

    # ─────────────────────────────────────
    # 보안 헤더 (기본값)
    # ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ─────────────────────────────────────
    # Virtual Host 설정 로드
    # ─────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
