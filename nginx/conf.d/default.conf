# ═════════════════════════════════════════════════════════════
# Exchange Rate Service - Phase 1 (HTTP)
# ═════════════════════════════════════════════════════════════
# 설명: SQLite 기반, AWS 프리티어 최적화
# SSL: 나중에 Let's Encrypt로 수동 설정
# ═════════════════════════════════════════════════════════════

# ─────────────────────────────────────
# Upstream (FastAPI 백엔드)
# ─────────────────────────────────────
upstream fastapi_backend {
    server fastapi:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ─────────────────────────────────────
# Rate Limiting (3 req/s)
# ─────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─────────────────────────────────────
# HTTP 서버
# ─────────────────────────────────────
server {
    listen 80;
    server_name _;

    # 클라이언트 설정
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip 압축 (nginx.conf에서 이미 활성화, 여기서는 추가 설정)
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─────────────────────────────────────
    # WebSocket (최대 우선순위, Rate Limit 없음)
    # ─────────────────────────────────────
    location /ws {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # WebSocket 헤더
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 타임아웃 (10분)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 버퍼링 비활성화 (실시간 통신)
        proxy_buffering off;
    }

    # ─────────────────────────────────────
    # API (Rate Limiting 적용: 3 req/s + burst 6)
    # ─────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=6 nodelay;
        limit_conn conn_limit 10;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 타임아웃
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────
    # 관리자 페이지
    # ─────────────────────────────────────
    location /admin {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 (로그 조회 등 시간이 걸릴 수 있음)
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────
    # 정적 파일 (Nginx에서 직접 서빙)
    # ─────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─────────────────────────────────────
    # 헬스체크 (Rate Limit 없음)
    # ─────────────────────────────────────
    location /health {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ─────────────────────────────────────
    # 루트 및 기타
    # ─────────────────────────────────────
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────
    # 에러 페이지
    # ─────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
