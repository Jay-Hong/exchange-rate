# ═════════════════════════════════════════════════════════════
# Exchange Rate Service - Phase 2 (HTTPS)
# ═════════════════════════════════════════════════════════════
# 설명: SQLite 기반, AWS 프리티어 최적화, Let's Encrypt SSL
# 도메인: fxi.kr
# ═════════════════════════════════════════════════════════════

# ─────────────────────────────────────
# Upstream (FastAPI 백엔드)
# ─────────────────────────────────────
upstream fastapi_backend {
    server fastapi:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ─────────────────────────────────────
# Rate Limiting
# ─────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;
# v2 구독자 실트래픽이 아직 없어 측정값으로 오독하면 안 된다. 10r/s는 W=4 identity
# canary 평균 처리량(~13/s) 아래의 capacity guard이고, burst 20은 재연결 동시 도착용이다.
# ⚠️ handshake 자체는 인증을 돌리지 않는다 — 인증은 subscribe에서 일어난다. 이 상한이 auth
# 부하를 직접 묶는 게 아니라, "연결 1개당 subscribe 최소 1회"라는 **대리 지표**로 묶는다.
# 초기 phased 구간의 lrs= 관측으로 재평가할 provisional handshake 남용 방지선이다.
limit_req_zone $binary_remote_addr zone=ws_handshake_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ─────────────────────────────────────
# HTTP 서버 (HTTPS로 리다이렉트)
# ─────────────────────────────────────
server {
    listen 80;
    server_name fxi.kr;

    # HTTP → HTTPS 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }

    # Let's Encrypt ACME 챌린지용 (인증서 갱신에 필요)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ─────────────────────────────────────
# HTTPS 서버
# ─────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name fxi.kr;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/fxi.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fxi.kr/privkey.pem;

    # SSL 설정 (Mozilla Intermediate 기준)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL 최적화
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 클라이언트 설정
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # 보안 헤더 (HTTPS 전용 강화)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # HSTS (1년)

    # Gzip 압축 (nginx.conf에서 이미 활성화, 여기서는 추가 설정)
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─────────────────────────────────────
    # WebSocket Secure (wss://, handshake 10 req/s + burst 20)
    # ─────────────────────────────────────
    location = /ws {
        # HTTP Upgrade handshake만 제한한다. 연결 뒤 subscribe frame은 이 경계 밖이다.
        # IP별 동시 연결 limit_conn은 carrier NAT 오탐 위험 때문에 의도적으로 유보한다.
        limit_req zone=ws_handshake_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # WebSocket 헤더
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # wss:// 지원

        # WebSocket 타임아웃 (10분)
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 버퍼링 비활성화 (실시간 통신)
        proxy_buffering off;
    }

    # ─────────────────────────────────────
    # API (3 req/s 지속 + burst 20; v2.0.0 cold-start 실측 12 req/s가 구 burst 6에서 bootstrap 4건을 잘랐다)
    # ─────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 10;

        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # API 타임아웃
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────
    # 관리자 페이지
    # ─────────────────────────────────────
    location /admin {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 타임아웃 (로그 조회 등 시간이 걸릴 수 있음)
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ─────────────────────────────────────
    # 정적 파일 (Nginx에서 직접 서빙)
    # ─────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─────────────────────────────────────
    # 헬스체크 (Rate Limit 없음)
    # ─────────────────────────────────────
    location /health {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ─────────────────────────────────────
    # 루트 및 기타
    # ─────────────────────────────────────
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ─────────────────────────────────────
    # 에러 페이지
    # ─────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
