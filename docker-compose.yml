# ═════════════════════════════════════════════════════════════
# Exchange Rate Service - Phase 1 (SQLite)
# ═════════════════════════════════════════════════════════════
# 목적: AWS 프리티어(t2.micro, 1GB RAM)에서 안정적 운영
# 메모리: ~315MB (Nginx 32MB + FastAPI 600MB 제한)
# 배포: docker-compose up -d
# ═════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────
  # Redis (Cache)
  # ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: exchange-rate-redis
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./volumes/logs/redis:/data/logs
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # Nginx (Reverse Proxy + HTTPS)
  # ─────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: exchange-rate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/static:ro
      - ./volumes/logs/nginx:/var/log/nginx
      # Let's Encrypt SSL 인증서 (호스트에서 마운트)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      fastapi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 16M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────
  # FastAPI (App + Crawler + SQLite + Selenium)
  # ─────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exchange-rate-app
    env_file:
      - .env
    environment:
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=sqlite:////data/exchange_rates.db
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ./data:/data
      - ./volumes/logs/app:/app/logs
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: '0.9'
          memory: 800M  # 700M → 800M (좀비 프로세스 정리 로직 추가로 여유 확보)
        reservations:
          cpus: '0.5'
          memory: 300M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    oom_score_adj: -500  # OOM Killer 보호 (가장 마지막에 종료)
    # Chrome headless용 공유 메모리 (--disable-dev-shm-usage 사용으로 최소화)
    shm_size: 64mb  # 512mb → 64mb (메모리 절약)

# ─────────────────────────────────────
# Volumes
# ─────────────────────────────────────
volumes:
  redis_data:
