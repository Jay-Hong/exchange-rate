# ═════════════════════════════════════════════════════════════
# Exchange Rate Service
# ═════════════════════════════════════════════════════════════
# 운영: AWS EC2 t3.small (2 vCPU, 2GB RAM, 서울 리전)
# 컨테이너 메모리 cap (deploy.resources.limits.memory):
#   - FastAPI: 800M (좀비 Chrome 정리 + Selenium 여유)
#   - Redis:   256M (maxmemory 100M + AOF rewrite / fragmentation / buffer 여유)
#   - Nginx:    32M
# 배포: docker compose up -d
# ═════════════════════════════════════════════════════════════

# 컨테이너 stdout 로그 무한 증가 방지 — **모든 서비스에 적용**한다.
# ⚠️ 이건 Docker json-file(=stdout) 한정이다. nginx access/error는 bind mount 파일에 직접 쓰므로
#    이 설정도 journald도 적용되지 않는다 → 호스트 logrotate(/etc/logrotate.d/fxi-nginx)가 담당한다.
#    (2026-07-26: 설정 없이 access.log가 275MB까지 자라 있었다.)
# ⚠️ 기존 컨테이너에는 자동 적용되지 않는다 — 다음 `--force-recreate` 시 반영.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # ─────────────────────────────────────
  # Redis (Cache)
  # ─────────────────────────────────────
  redis:
    # Codex/Claude 합의 (2026-05-16): 7.4-alpine pin으로 patch lane 고정.
    # 7-alpine은 7.x 안에서 minor drift 받음. 의도는 7.4.x patch refresh이지
    # 7.5+ minor upgrade 아님. major(7→8)는 별 검증 PR로 분리.
    image: redis:7.4-alpine
    container_name: exchange-rate-redis
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./volumes/logs/redis:/data/logs
    ports:
      - "6379:6379"
    deploy:
      # Redis maxmemory 100M은 application-layer eviction 한도.
      # container memory cap은 AOF rewrite / jemalloc fragmentation /
      # client buffer / process RSS 합산 한도. 실측 ~8M, peak 2.25M,
      # AOF 21M이라 256M은 32배+ 여유 (보수적).
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─────────────────────────────────────
  # Nginx (Reverse Proxy + HTTPS)
  # ─────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: exchange-rate-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/static:ro
      - ./volumes/logs/nginx:/var/log/nginx
      # Let's Encrypt SSL 인증서 (호스트에서 마운트)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      fastapi:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 16M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ─────────────────────────────────────
  # FastAPI (App + Crawler + SQLite + Selenium)
  # ─────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exchange-rate-app
    env_file:
      - .env
    environment:
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/exchange_rates.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ./data:/data
      - ./volumes/logs/app:/app/logs
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.9'
          memory: 800M  # 700M → 800M (좀비 프로세스 정리 로직 추가로 여유 확보)
        reservations:
          cpus: '0.5'
          memory: 300M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    oom_score_adj: -500  # OOM Killer 보호 (가장 마지막에 종료)
    # Chrome headless용 공유 메모리 (--disable-dev-shm-usage 사용으로 최소화)
    shm_size: 64mb  # 512mb → 64mb (메모리 절약)

# ─────────────────────────────────────
# Volumes
# ─────────────────────────────────────
volumes:
  redis_data:
