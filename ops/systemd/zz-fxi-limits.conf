# /etc/systemd/journald.conf.d/zz-fxi-limits.conf 로 설치 (정본은 이 파일).
# fxi-managed: ops/systemd/zz-fxi-limits.conf
#
# 왜 `zz-` 접두사인가: systemd drop-in은 **디렉토리와 무관하게 파일명 lexical 순서**로 처리되고
# **뒤에 오는 정의가 이긴다**. 관례인 `NN-` 숫자 접두사는 ASCII상 숫자(0x30~)가 소문자(0x61~)보다
# **앞**이라, 접두사 없는 배포판 drop-in(예: /usr/lib/.../syslog.conf)에 **진다**.
#   실측 정렬: 90-fxi-limits.conf < limits.conf < syslog.conf < zz-fxi-limits.conf
# 이 파일은 디스크 안전 상한이라 조용히 덮이면 안 되므로 **마지막으로 정렬되는 이름**을 쓴다.
# 2026-07-26 실측: 상한이 없어 journal이 892MB까지 증가했다 (정리 후 92MB).
# 일회성 정리는 `journalctl --rotate --vacuum-size=100M` — `--rotate`가 없으면 archived만 대상이라
# active journal이 남는다.
[Journal]
SystemMaxUse=200M
SystemKeepFree=2G
