# 배포·cron이 **공유하는 lock 경로의 유일한 정본**.
#
# 왜 파일인가: 이 값이 세 스크립트에 각각 리터럴로 있고 각각 env로 재정의되던 동안,
# `LOCK_FILE=/tmp/other.lock ops/deploy-fastapi.sh …`가 canonical crontab 검사를 통과하면서
# **상호배제만 사라지는** 상태를 만들 수 있었다(실측). 위험은 재정의 가능성 자체가 아니라
# **독립적인** 재정의다 — 두 쪽이 따로 움직일 수 있으면 배제가 깨진다.
#
# 그래서 손잡이를 하나로 만든다: 재정의는 `FXI_LOCK_CONF`로 **이 파일을 갈아끼우는 것**뿐이고,
# 그러면 배포·cron·wrapper가 **함께** 움직여 배제가 유지된다(테스트가 그걸 쓴다).
# ⛔ 개별 스크립트에 `${LOCK_FILE:-…}` 류 fallback을 다시 넣지 말 것.
FXI_DEPLOY_LOCK=/var/lock/fxi-deploy.lock
