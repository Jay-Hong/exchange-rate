# W canary 수직 리허설 전용 로컬 스택. 기본 compose와 병합하지 않는다.
#
# 기본 파일을 함께 쓰면 고정 container_name, 6379/80/443 host port, ./data와 로그 bind mount를
# 상속한다. 그러면 이름만 별도 project여도 운영/개발 스택과 자원 및 데이터가 격리되지 않는다.
#
# 사용:
#   cp .env.rehearsal.example .env.rehearsal
#   chmod 600 .env.rehearsal
#   docker compose --env-file .env.rehearsal -p fxi-rehearsal \
#     -f docker-compose.rehearsal.yml up -d
#   python scripts/canary_monitor.py --rehearse --inject-abort-after 3 \
#     --project fxi-rehearsal --compose-file docker-compose.rehearsal.yml \
#     --container fxi-rehearsal-app --env-file .env.rehearsal \
#     --url ws://127.0.0.1:18000/ws
#
# `.env.rehearsal`은 gitignored 로컬 파일이다. 운영 `.env`를 복사하지 않는다.

services:
  redis:
    image: redis:7.4-alpine
    container_name: fxi-rehearsal-redis
    command: redis-server --appendonly no --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - rehearsal_redis_data:/data

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fxi-rehearsal-app
    environment:
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/exchange_rates.db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_LATEST_ENABLED=${REDIS_LATEST_ENABLED:-false}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH}
      - REVENUECAT_API_KEY=${REVENUECAT_API_KEY:-}
      - REVENUECAT_WEBHOOK_AUTH_KEY=${REVENUECAT_WEBHOOK_AUTH_KEY:-}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - KRX_FUTURES_ENABLED=${KRX_FUTURES_ENABLED:-false}
      - KRX_CLIENT_DISTRIBUTION_ENABLED=${KRX_CLIENT_DISTRIBUTION_ENABLED:-false}
      - TOPIC_DISPATCHER_ENABLED=${TOPIC_DISPATCHER_ENABLED:-false}
      - DEFAULT_EXECUTOR_PROBE_ENABLED=${DEFAULT_EXECUTOR_PROBE_ENABLED:-false}
      - DEFAULT_EXECUTOR_PROBE_INTERVAL_SECONDS=${DEFAULT_EXECUTOR_PROBE_INTERVAL_SECONDS:-1}
      - WS_AUTH_EXECUTOR_LOG_TIMINGS=${WS_AUTH_EXECUTOR_LOG_TIMINGS:-false}
    volumes:
      - rehearsal_app_data:/data
      - rehearsal_app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 600M

volumes:
  rehearsal_redis_data:
  rehearsal_app_data:
  rehearsal_app_logs:
